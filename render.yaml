# Render Blueprint para el panel de administración web (React + Vite).
# El build genera la carpeta dist y Render publica ese resultado.

services:
  - type: web
    name: granbar-admin-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # React Router usa rutas del navegador (/productos, /caja, /cierre).
      # Render debe devolver index.html en cualquier ruta para el SPA.
      - type: rewrite
        source: /*
        destination: /index.html
