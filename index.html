<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GranBar BQD · Administración</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-wrap">
      <section class="login-hero">
        <div class="brand-mark big">GB</div>
        <h1>GranBar BQD</h1>
        <p>
          Panel de administración para productos, caja, facturas y cierres del
          restaurante.
        </p>
        <ul>
          <li>Gestiona el catálogo y el stock</li>
          <li>Cobra, edita e imprime facturas</li>
          <li>Cierra la caja y descarga reportes PDF</li>
        </ul>
      </section>

      <section class="login-card">
        <h2>Ingresar</h2>
        <p>Usa tu código de acceso de caja o administración.</p>

        <form id="loginForm" autocomplete="on">
          <label class="field">
            <span>Código de acceso</span>
            <input
              id="code"
              class="input"
              type="password"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="••••"
              required
              autofocus
            />
          </label>

          <div id="loginError" class="alert error hidden" role="alert"></div>

          <button id="loginBtn" class="btn btn-primary" type="submit">
            Entrar al panel
          </button>
        </form>

        <div class="login-footer">
          <span>Servidor</span>
          <button type="button" class="btn btn-ghost btn-sm" id="serverBtn">
            <strong id="serverLabel"></strong>
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
