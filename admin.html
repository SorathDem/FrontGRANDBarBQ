<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos · GranBar BQD</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#c62828" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header id="app-nav" class="topbar"></header>

    <main class="page">
      <div class="page-head">
        <div>
          <p class="eyebrow">Panel de administración</p>
          <h1>Productos</h1>
          <p class="subtle" id="productCount">Cargando catálogo…</p>
        </div>
        <div class="page-actions">
          <button id="addBtn" class="btn btn-primary" type="button">
            ＋ Nuevo producto
          </button>
        </div>
      </div>

      <div id="pageAlert" class="alert hidden" role="status"></div>
      <div id="lowStock" class="alert warn hidden" role="status"></div>

      <div class="toolbar">
        <input
          id="search"
          class="input"
          type="search"
          placeholder="Buscar por nombre o categoría…"
          aria-label="Buscar productos"
        />
        <button id="refreshBtn" class="btn btn-ghost" type="button">
          Actualizar
        </button>
      </div>

      <section class="card table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th style="text-align: right">Acciones</th>
              </tr>
            </thead>
            <tbody id="productBody"></tbody>
          </table>
        </div>
        <div id="empty" class="empty hidden">
          <strong>Sin productos</strong>
          <span id="emptyText">Agrega el primer producto del catálogo.</span>
        </div>
      </section>
    </main>

    <dialog id="productDialog" class="modal" aria-labelledby="productDialogTitle">
      <form id="productForm">
        <div class="modal-head">
          <div>
            <h2 id="productDialogTitle">Nuevo producto</h2>
            <p class="subtle" id="productDialogSubtitle">
              Completa los datos para agregarlo al catálogo.
            </p>
          </div>
          <button class="icon-btn" type="button" data-close aria-label="Cerrar">
            ✕
          </button>
        </div>

        <div class="modal-body">
          <div class="grid-2">
            <label class="field">
              <span>Nombre</span>
              <input
                id="pName"
                class="input"
                type="text"
                placeholder="Ej. Hamburguesa clásica"
                required
              />
            </label>
            <label class="field">
              <span>Categoría</span>
              <input
                id="pCategory"
                class="input"
                type="text"
                placeholder="Ej. Comidas"
              />
            </label>
            <label class="field">
              <span>Precio</span>
              <input
                id="pPrice"
                class="input"
                type="number"
                min="0"
                step="1"
                placeholder="0"
                required
              />
            </label>
            <label class="field">
              <span>Stock</span>
              <input
                id="pStock"
                class="input"
                type="number"
                min="0"
                step="1"
                placeholder="0"
              />
            </label>
          </div>

          <div id="productError" class="alert error form-error hidden"></div>
        </div>

        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" data-close>
            Cancelar
          </button>
          <button id="saveProductBtn" class="btn btn-primary" type="submit">
            Guardar producto
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="js/products.js"></script>
  </body>
</html>
